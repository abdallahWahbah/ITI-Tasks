<div class="container my-4">
  <h3 class="text-center mb-4">Student List</h3>

  <div class="table-responsive shadow-sm rounded">
    <table class="table table-bordered table-hover align-middle text-center">
      <thead class="table-primary">
        <tr>
          <th scope="col">Index</th>
          <th scope="col">ID</th>
          <th scope="col">Name</th>
          <th scope="col">Name start with 'A'</th>
          <th scope="col">Age</th>
          <th scope="col">Address</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>

      <tbody>
          @for (std of filteredStudents; track $index; let i = $index) {
              <tr>
              <td>{{ i + 1 }}</td>
              <td>{{ std.id }}</td>
              <td>{{ std.name }}</td>
              <td>{{std.name | firstLetterCheck: 'A'}}</td>
              <td class='red__color' [ngClass]="{'green__color': std.age > 23}">{{ std.age }}</td>
              <td>{{ std.address }}</td>
              <td>
                  <button 
                      class="btn btn-sm btn-warning me-2"
                      (click)="handleNavigation(std.id, 'edit')"
                      >
                      Update
                  </button>
                  <button 
                      class="btn btn-sm btn-warning me-2"
                      (click)="handleNavigation(std.id, 'details')"
                      >
                      Details
                  </button>
                  <button 
                      class="btn btn-sm btn-danger" 
                      (click)="handleNavigation(std.id, 'deleted')"
                  >
                      Delete
                  </button>
              </td>
              </tr>
          } @empty {
              <tr>
              <td colspan="7" class="text-muted py-3">No students found</td>
              </tr>
          }
      </tbody>
    </table>
  </div>
</div>
